# N2 training-step smoke: managed-local full stack on Ascend NPU.
#
# One `specforge train` command launches the Mooncake master, one SGLang
# capture server running the specforge-sglang-capture plugin (physical NPU
# card 1), the capture producer, and a single-rank DFlash trainer (physical
# NPU card 2). The draft is initialized from configs/qwen3.5-4b-dflash.json;
# this is a functional smoke (finite loss, lifecycle correctness), not a
# quality run.
model:
  target_model_path: "/data1/f00538480/Qwen3.5-4B"
  draft_model_config: "/data1/f00538480/specforge-npu-capture/configs/qwen3.5-4b-dflash.json"
  target_backend: sglang
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  sglang_attention_backend: ascend
data:
  train_data_path: "/data1/f00538480/specforge-npu-capture/scripts/npu/smoke/smoke_dataset.jsonl"
  max_length: 1024
  max_prompts: 8
  chat_template: "qwen3.5"
  build_dataset_num_proc: 4
  cache_dir: "/data1/f00538480/specforge-npu-capture/scripts/npu/smoke/cache"
training:
  strategy: "dflash"
  num_epochs: 1
  max_steps: 3
  batch_size: 1
  accumulation_steps: 1
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "sdpa"
  num_anchors: 64
  loss_decay_gamma: 7
  save_interval: 10000
  log_interval: 1
  dist_timeout: 60
  seed: 42
tracking:
  report_to: "none"
run_id: "qwen3.5-4b-dflash-npu-smoke"
output_dir: "/data1/f00538480/specforge-npu-capture/scripts/npu/smoke/outputs"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: /data1/f00538480/specforge-npu-capture/scripts/npu/smoke/outputs/control
    consumer_state_dir: /data1/f00538480/specforge-npu-capture/scripts/npu/smoke/outputs/consumer-state
    backend: mooncake
    server_capture: plugin
    managed_local:
      trainer_cuda_visible_devices: ["2"]
      mooncake:
        global_segment_size_bytes: 4294967296
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["1"]
          tp_size: 1
          env:
            SGLANG_MAMBA_SSM_DTYPE: "bfloat16"
